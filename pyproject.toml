[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-uplift-modeling"
version = "0.1.0"
description = "Calibrated churn risk on the IBM Telco data and S/T/X uplift learners on the randomized Hillstrom e-mail test, scored on holdouts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3", "scikit-learn>=1.7"]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-timeout>=2.4",
  "ruff>=0.17",
  "mypy>=2.4",
  "pip-audit>=2.10",
]

[project.scripts]
cum = "churn_uplift_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# scikit-learn ships no type information; its objects are typed as Any at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
