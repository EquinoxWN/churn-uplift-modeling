name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make ci
      - name: Known-vulnerability audit
        run: make audit
      - name: Synthetic churn and uplift runs
        run: |
          cum churn --synthetic | tee churn.log
          cum uplift --synthetic | tee uplift.log
          echo "::notice title=Synthetic churn (gbm, isotonic)::$(grep '| gbm | isotonic' churn.log)"
          echo "::notice title=Synthetic uplift (X-learner)::$(grep '| X | gbm' uplift.log)"
      - name: Public data runs (Telco, Hillstrom; SHA-256 checked)
        run: |
          make run | tee run.log
          echo "::notice title=Telco churn (gbm, isotonic)::$(grep '| gbm | isotonic' run.log)"
          echo "::notice title=Hillstrom uplift (X-learner)::$(grep '| X | gbm' run.log)"
